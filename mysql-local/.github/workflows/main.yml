name: CI — Build, Test y Push a DockerHub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    # ── Levanta un MySQL de servicio para los tests de integración ──
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_pass
          MYSQL_DATABASE: bdget_db
          MYSQL_USER: bdget_user
          MYSQL_PASSWORD: bdget_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot_pass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # ── Paso 1: Descargar el código del repositorio ──
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # ── Paso 2: Configurar Java 17 ──
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # ── Paso 3: Ejecutar tests con Maven ──
      - name: Ejecutar tests
        run: mvn test
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/bdget_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: bdget_user
          SPRING_DATASOURCE_PASSWORD: bdget_pass

      # ── Paso 4: Generar reporte de cobertura JaCoCo ──
      - name: Generar reporte de cobertura
        run: mvn jacoco:report

      # ── Paso 5: Subir reporte de cobertura como artefacto ──
      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      # ── Paso 6: Construir el .jar para la imagen Docker ──
      - name: Build del proyecto
        run: mvn package -DskipTests

      # ── Paso 7: Autenticarse en DockerHub ──
      - name: Login en DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Paso 8: Construir la imagen Docker ──
      - name: Build de la imagen Docker
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/bdget-app:latest .

      # ── Paso 9: Publicar la imagen en DockerHub ──
      - name: Push de la imagen a DockerHub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/bdget-app:latest
